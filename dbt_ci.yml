name: dbt CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # Workload Identity Federation

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip fork PRs (they can't get OIDC tokens or repo variables)
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_CI_PROJECT_ID }}
      DBT_DATASET: ci_pr_${{ github.event.pull_request.number }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        run: dbt deps

      - name: Lint changed SQL
        run: |
          FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- 'models/*.sql')
          if [ -n "$FILES" ]; then
            sqlfluff lint $FILES
          else
            echo "No changed SQL files to lint."
          fi

      - name: dbt build and test
        run: dbt build --target ci --profiles-dir .
