name: dbt CD

"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC (runs on default branch only)
  workflow_dispatch: {}

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROD_PROJECT_ID }}
      DBT_DATASET: ${{ vars.DBT_PROD_DATASET }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: dbt deps
        run: dbt deps

      - name: dbt build
        run: dbt build --target prod --profiles-dir .

      - name: dbt docs generate
        run: dbt docs generate --target prod --profiles-dir .

      - name: Source freshness (non-blocking)
        continue-on-error: true
        run: dbt source freshness --target prod --profiles-dir .

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
          if-no-files-found: warn
