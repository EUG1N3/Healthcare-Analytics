name: dbt CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROD_PROJECT_ID }}
      DBT_DATASET: ${{ vars.DBT_PROD_DATASET }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - run: pip install -r requirements.txt

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: dbt deps

      - run: dbt build --target prod --profiles-dir .

      - run: dbt docs generate --target prod --profiles-dir .

      - name: Source freshness (non-blocking)
        continue-on-error: true
        run: dbt source freshness --target prod --profiles-dir .

      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            target/index.html
            target/manifest.json
            target/catalog.json
