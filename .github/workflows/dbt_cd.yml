name: dbt CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: dbt-cd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROD_PROJECT_ID }}
      DBT_DATASET: ${{ vars.DBT_PROD_DATASET }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/healthcare_analysis
      DBT_PROFILES_DIR: ${{ github.workspace }}/healthcare_analysis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PROD_SERVICE_ACCOUNT }}

      - name: Who am I (temporary)
        run: gcloud auth list

      - run: dbt deps
      - run: dbt build --target prod
      - run: dbt docs generate --target prod

      - name: Source freshness (non-blocking)
        continue-on-error: true
        run: dbt source freshness --target prod

      - name: Upload docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            healthcare_analysis/target/index.html
            healthcare_analysis/target/manifest.json
            healthcare_analysis/target/catalog.json
          if-no-files-found: warn
