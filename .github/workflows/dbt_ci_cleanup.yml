name: dbt CI cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: dbt-ci-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Drop PR datasets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT: ${{ vars.GCP_CI_PROJECT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Drop this PR's datasets
        run: |
          set -uo pipefail
          prefix="ci_pr_${PR}"

          if ! bq ls -d --project_id="$PROJECT" --max_results=1000 --format=csv > datasets.txt 2> bq_err.txt; then
            echo "bq ls failed:"
            cat bq_err.txt
            exit 1
          fi

          echo "bq output (for debugging):"
          cat datasets.txt

          datasets=$(tr -d '\r' < datasets.txt | grep -E "^${prefix}(_[A-Za-z0-9_]+)?$" || true)

          if [ -z "$datasets" ]; then
            echo "No datasets found for ${prefix}"
            exit 0
          fi

          for ds in $datasets; do
            echo "Dropping ${ds}"
            bq rm -r -f -d "${PROJECT}:${ds}"
          done
