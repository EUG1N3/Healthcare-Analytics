name: dbt CI cleanup

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      PROJECT: ${{ vars.GCP_CI_PROJECT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Drop this PR's datasets
        run: |
          for ds in $(bq ls -d --project_id="$PROJECT" --max_results=1000 \
                        --format=json | jq -r '.[].datasetReference.datasetId'); do
            if [ "$ds" = "ci_pr_${PR}" ] || [[ "$ds" == ci_pr_${PR}_* ]]; then
              echo "Dropping $ds"
              bq rm -r -f -d "${PROJECT}:${ds}"
            fi
          done
