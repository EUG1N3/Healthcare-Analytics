name: dbt CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_CI_PROJECT_ID }}
      DBT_DATASET: ci_pr_${{ github.event.pull_request.number }}
      BQ_LOCATION: ${{ vars.BQ_LOCATION }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/healthcare_analysis
      DBT_PROFILES_DIR: ${{ github.workspace }}/healthcare_analysis
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}

      - name: Who am I (temporary)
        run: gcloud auth list

      - run: dbt deps

      - name: Lint changed SQL
        working-directory: healthcare_analysis
        run: |
          FILES=$(git diff --relative --name-only --diff-filter=d origin/${{ github.base_ref }}...HEAD -- 'models/*.sql')
          if [ -n "$FILES" ]; then
            echo "$FILES"
            sqlfluff lint $FILES
          else
            echo "No changed SQL files to lint."
          fi

      - run: dbt build --target ci
